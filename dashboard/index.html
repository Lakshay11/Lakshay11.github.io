<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>P1 Finance Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4">

  <div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">P1 Finance Dashboard</h1>

    <!-- Status -->
    <div id="status"
         class="mb-4 text-sm text-red-600 hidden">
    </div>

    <!-- Finance Table -->
    <div class="bg-white rounded-lg shadow p-4">
      <table class="w-full border">
        <thead class="bg-gray-200">
          <tr>
            <th class="p-2 border text-left">Item</th>
            <th class="p-2 border text-left">Category</th>
            <th class="p-2 border text-right">Cost (₹)</th>
          </tr>
        </thead>

        <tbody id="finance-body">
          <tr>
            <td colspan="3" class="p-4 text-center text-gray-500">
              Loading…
            </td>
          </tr>
        </tbody>

        <tfoot class="bg-gray-100 font-semibold">
          <tr>
            <td colspan="2" class="p-2 border text-right">Total</td>
            <td id="finance-total" class="p-2 border text-right">—</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

<script>
/* ================= CONFIG ================= */

const API_URL = 'https://script.google.com/macros/s/AKfycbxXn0cCQ83E-7mpdR1b3Bup5Zr3FntgUwztmMk2iUFuBLcd9eUt-u5Ez9QRd63LWQmr9w/exec';

// Debug logging
function debugLog(message, data = null) {
  console.log('[DASHBOARD DEBUG]', message, data || '');
  const statusEl = document.getElementById('status');
  if (statusEl) {
    const currentContent = statusEl.innerHTML;
    statusEl.innerHTML = currentContent + `<br><small class="text-gray-600">[DEBUG] ${message}</small>`;
    statusEl.classList.remove('hidden');
  }
}

/* ================= HELPERS ================= */

function setStatus(msg) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.classList.remove('hidden');
}

function clearStatus() {
  document.getElementById('status').classList.add('hidden');
}

/* ================= BOOTSTRAP ================= */

async function bootstrapIfNeeded() {
  const token = localStorage.getItem('dash_token');
  const email = localStorage.getItem('dash_email');

  if (token && email) return true;

  setStatus(
    'First-time setup required. <button onclick="bootstrap()" class="bg-blue-500 text-white px-2 py-1 rounded text-xs ml-2">Bootstrap Now</button>'
  );
  return false;
}

async function bootstrap() {
  debugLog('Starting bootstrap...');
  debugLog('API URL:', API_URL);
  
  try {
    debugLog('Making bootstrap request...');
    const url = `${API_URL}?action=bootstrap`;
    debugLog('Full URL:', url);
    
    const res = await fetch(url);
    debugLog('Response status:', res.status);
    debugLog('Response headers:', [...res.headers.entries()]);
    
    const responseText = await res.text();
    debugLog('Raw response:', responseText);
    
    let data;
    try {
      data = JSON.parse(responseText);
      debugLog('Parsed JSON:', data);
    } catch (parseErr) {
      debugLog('JSON parse failed:', parseErr.message);
      throw new Error('Invalid JSON response: ' + responseText);
    }
    
    if (data.error) {
      debugLog('API returned error:', data.error);
      throw new Error(data.error);
    }
    
    debugLog('Bootstrap successful, storing token and email');
    localStorage.setItem('dash_token', data.token);
    localStorage.setItem('dash_email', data.email);
    
    clearStatus();
    loadFinance();
    
  } catch (err) {
    debugLog('Bootstrap error:', err.message);
    setStatus('Bootstrap failed: ' + err.message);
  }
}

/* ================= DATA LOAD ================= */

async function loadFinance() {
  debugLog('Starting loadFinance...');
  clearStatus();

  const ready = await bootstrapIfNeeded();
  if (!ready) {
    debugLog('Bootstrap needed, stopping loadFinance');
    return;
  }

  const token = localStorage.getItem('dash_token');
  const email = localStorage.getItem('dash_email');
  
  debugLog('Retrieved token from localStorage:', token ? 'exists' : 'missing');
  debugLog('Retrieved email from localStorage:', email);

  try {
    const url = `${API_URL}?action=finance_p1&token=${encodeURIComponent(token)}&email=${encodeURIComponent(email)}`;
    debugLog('Finance request URL:', url);
    
    const res = await fetch(url);
    debugLog('Finance response status:', res.status);
    
    const responseText = await res.text();
    debugLog('Finance raw response:', responseText);
    
    const data = JSON.parse(responseText);
    debugLog('Finance parsed data:', data);

    if (data.error) {
      debugLog('Finance API error:', data.error);
      throw new Error(data.error);
    }

    debugLog('Finance data loaded successfully');
    renderFinance(data);

  } catch (err) {
    debugLog('Finance load error:', err.message);
    setStatus('Access denied or token expired. Re-run bootstrap.');
  }
}

/* ================= RENDER ================= */

function renderFinance(data) {
  const tbody = document.getElementById('finance-body');
  tbody.innerHTML = '';

  if (!data.items.length) {
    tbody.innerHTML = `
      <tr>
        <td colspan="3" class="p-4 text-center text-gray-500">
          No P1 items found
        </td>
      </tr>
    `;
    return;
  }

  data.items.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="p-2 border">${row.item}</td>
      <td class="p-2 border">${row.category}</td>
      <td class="p-2 border text-right">₹${row.cost.toLocaleString()}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('finance-total')
    .textContent = `₹${data.total.toLocaleString()}`;
}

/* ================= INIT ================= */

loadFinance();
</script>

</body>
</html>
