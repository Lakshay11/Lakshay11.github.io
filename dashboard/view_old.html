<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Personal Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4">

  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-center">Personal Dashboard</h1>

    <!-- Status -->
    <div id="status" class="mb-4 text-sm text-red-600 hidden"></div>

    <!-- 4-Block Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      
      <!-- Today's Tasks Block -->
      <div class="bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-3 text-blue-600">Today's Tasks</h2>
        <div id="today-tasks" class="space-y-2">
          <div class="text-center text-gray-500 text-sm">Loading...</div>
        </div>
      </div>

      <!-- Week's Tasks Block -->
      <div class="bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-3 text-green-600">This Week</h2>
        <div id="week-tasks" class="space-y-2">
          <div class="text-center text-gray-500 text-sm">Loading...</div>
        </div>
      </div>

      <!-- Finance Summary Block -->
      <div class="bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-3 text-purple-600">Finance Summary</h2>
        <div id="finance-summary" class="space-y-2">
          <div class="text-center text-gray-500 text-sm">Loading...</div>
        </div>
      </div>

    </div>

    <!-- Finance Details Row -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mt-4">
      
      <!-- P1 Finance -->
      <div class="bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-3 text-red-600">P1 Expenses</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-100">
              <tr>
                <th class="p-2 text-left">Item</th>
                <th class="p-2 text-right">Cost</th>
              </tr>
            </thead>
            <tbody id="p1-finance" class="divide-y">
              <tr>
                <td colspan="2" class="p-4 text-center text-gray-500">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- P2 Finance -->
      <div class="bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-3 text-orange-600">P2 Expenses</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-100">
              <tr>
                <th class="p-2 text-left">Item</th>
                <th class="p-2 text-right">Cost</th>
              </tr>
            </thead>
            <tbody id="p2-finance" class="divide-y">
              <tr>
                <td colspan="2" class="p-4 text-center text-gray-500">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- P3 Finance -->
      <div class="bg-white rounded-lg shadow p-4">
        <h2 class="text-lg font-semibold mb-3 text-yellow-600">P3 Expenses</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-100">
              <tr>
                <th class="p-2 text-left">Item</th>
                <th class="p-2 text-right">Cost</th>
              </tr>
            </thead>
            <tbody id="p3-finance" class="divide-y">
              <tr>
                <td colspan="2" class="p-4 text-center text-gray-500">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <!-- Login/Refresh Section -->
    <div class="mt-6 text-center">
      <div id="auth-section" class="hidden">
        <input type="password" id="password" class="border px-3 py-2 mr-2" placeholder="Enter password">
        <button onclick="loadAllData()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
          Load Dashboard
        </button>
      </div>
      <button onclick="loadAllData()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
        Refresh Data
      </button>
    </div>

  </div>

<script>
/* ================= CONFIG ================= */

const API_URL = 'https://script.google.com/macros/s/AKfycbwICZMwXev2MbtYTBkbKoRpXj-t6ZYkITrd2uE8FV_fsDzJwDlL-wZVvX3dT7YTA7dbIQ/exec';

// Simple logging to console only (no display)
function debugLog(message, data = null) {
  console.log('[DASHBOARD]', message, data || '');
}

/* ================= HELPERS ================= */

function setStatus(msg) {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.classList.remove('hidden');
}

function clearStatus() {
  document.getElementById('status').classList.add('hidden');
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  
  try {
    const date = new Date(dateStr);
    if (isNaN(date.getTime())) return dateStr; // Return original if invalid
    
    const options = { month: 'short', day: 'numeric' };
    return date.toLocaleDateString('en-US', options);
  } catch (e) {
    return dateStr; // Return original if formatting fails
  }
}

/* ================= DATA LOAD ================= */

async function loadAllData() {
  const password = document.getElementById('password')?.value;
  
  if (!password) {
    setStatus('Please enter a password');
    return;
  }
  
  try {
    setStatus('Loading data...');
    
    const url = `${API_URL}?action=dashboard&password=${encodeURIComponent(password)}`;
    
    const res = await fetch(url);
    const responseText = await res.text();
    const data = JSON.parse(responseText);
    
    if (data.error) {
      throw new Error(data.error);
    }
    
    renderDashboard(data);
    
  } catch (err) {
    setStatus('Access denied. Wrong password.');
    document.getElementById('auth-section').classList.remove('hidden');
  }
}

/* ================= RENDER ================= */

function renderDashboard(data) {
  clearStatus();
  
  // Render Today's Tasks (P1 only)
  renderTodayTasks(data.tasks.today);
  
  // Render Week's Tasks (P1 only)
  renderWeekTasks(data.tasks.week);
  
  // Render Finance Summary
  renderFinanceSummary(data.finances);
  
  // Render Finance Details
  renderFinanceDetails(data.finances);
}

function renderTodayTasks(tasks) {
  const container = document.getElementById('today-tasks');
  
  if (!tasks || tasks.length === 0) {
    container.innerHTML = '<div class="text-center text-gray-500 text-sm">No P1 tasks for today</div>';
    return;
  }
  
  container.innerHTML = tasks.map(task => `
    <div class="border-l-4 border-blue-500 pl-3 py-1">
      <div class="font-medium text-sm">${task.task}</div>
      <div class="text-xs text-gray-500">${task.status}</div>
    </div>
  `).join('');
}

function renderWeekTasks(tasks) {
  const container = document.getElementById('week-tasks');
  
  if (!tasks || tasks.length === 0) {
    container.innerHTML = '<div class="text-center text-gray-500 text-sm">No P1 tasks this week</div>';
    return;
  }
  
  container.innerHTML = tasks.map(task => `
    <div class="border-l-4 border-green-500 pl-3 py-1">
      <div class="font-medium text-sm">${task.task}</div>
      <div class="text-xs text-gray-500">${formatDate(task.date)} • ${task.status}</div>
    </div>
  `).join('');
}

function renderFinanceSummary(finances) {
  const container = document.getElementById('finance-summary');
  
  const summary = `
    <div class="space-y-3">
      <div class="flex justify-between items-center p-2 bg-red-50 rounded">
        <span class="text-sm font-medium">P1 Total:</span>
        <span class="text-sm font-bold text-red-600">₹${finances.p1?.total?.toLocaleString() || 0}</span>
      </div>
      <div class="flex justify-between items-center p-2 bg-orange-50 rounded">
        <span class="text-sm font-medium">P2 Total:</span>
        <span class="text-sm font-bold text-orange-600">₹${finances.p2?.total?.toLocaleString() || 0}</span>
      </div>
      <div class="flex justify-between items-center p-2 bg-yellow-50 rounded">
        <span class="text-sm font-medium">P3 Total:</span>
        <span class="text-sm font-bold text-yellow-600">₹${finances.p3?.total?.toLocaleString() || 0}</span>
      </div>
      <div class="flex justify-between items-center p-2 bg-gray-100 rounded font-bold">
        <span class="text-sm">Grand Total:</span>
        <span class="text-sm">₹${((finances.p1?.total || 0) + (finances.p2?.total || 0) + (finances.p3?.total || 0)).toLocaleString()}</span>
      </div>
    </div>
  `;
  
  container.innerHTML = summary;
}

function renderFinanceDetails(finances) {
  // Render P1 Finance
  renderFinanceTable('p1-finance', finances.p1);
  
  // Render P2 Finance  
  renderFinanceTable('p2-finance', finances.p2);
  
  // Render P3 Finance
  renderFinanceTable('p3-finance', finances.p3);
}

function renderFinanceTable(elementId, financeData) {
  const tbody = document.getElementById(elementId);
  
  if (!financeData || !financeData.items || financeData.items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" class="p-4 text-center text-gray-500 text-sm">No items</td></tr>';
    return;
  }
  
  tbody.innerHTML = financeData.items.slice(0, 5).map(item => `
    <tr>
      <td class="p-2 text-sm">${item.item}</td>
      <td class="p-2 text-right text-sm font-medium">₹${item.cost.toLocaleString()}</td>
    </tr>
  `).join('');
  
  if (financeData.items.length > 5) {
    tbody.innerHTML += `<tr><td colspan="2" class="p-2 text-center text-xs text-gray-500">+${financeData.items.length - 5} more items</td></tr>`;
  }
}

/* ================= INIT ================= */

// Show password prompt on page load
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('auth-section').classList.remove('hidden');
  setStatus('Enter password to access dashboard');
});

</script>

</body>
</html>
